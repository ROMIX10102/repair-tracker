<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — Ремонт Инструментов</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --surface-0: #0A0E14;
            --surface-1: #0F1419;
            --surface-2: #13171D;
            --surface-3: #1A1F28;
            --surface-4: #22272F;
            --surface-5: #2C3139;

            --accent: #38BDF8;
            --accent-dim: #0C4A6E;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --warning: #FB923C;
            --success: #6EE7B7;

            --text-primary: #E8EDF3;
            --text-secondary: #8B95A3;
            --text-dim: #5F6975;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 999px;

            --space-xs: 0.5rem;
            --space-sm: 0.75rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            --space-2xl: 3rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--surface-0);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: var(--space-lg);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: var(--surface-2);
            border: 1px solid var(--surface-4);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            max-width: 600px;
            margin: 0 auto;
        }

        .card-header { margin-bottom: var(--space-xl); }

        .card-title {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: var(--space-xs);
            letter-spacing: -0.02em;
        }

        .card-subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .form-group { margin-bottom: var(--space-lg); }

        .label {
            display: block;
            margin-bottom: var(--space-sm);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .input {
            width: 100%;
            background: var(--surface-1);
            border: 1px solid var(--surface-4);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface-2);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input::placeholder { color: var(--text-dim); }

        .textarea {
            min-height: 100px;
            resize: vertical;
        }

        .select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%238B95A3' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            padding-right: 2.5rem;
            cursor: pointer;
        }

        .btn {
            background: var(--accent);
            color: var(--surface-0);
            border: none;
            border-radius: var(--radius-full);
            padding: var(--space-md) var(--space-xl);
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            background: #0EA5E9;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
        }

        .btn-small {
            padding: var(--space-sm) var(--space-lg);
            font-size: 0.875rem;
            width: auto;
        }

        .status-badge {
            display: inline-block;
            padding: var(--space-xs) var(--space-md);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .status-received { background: var(--accent-dim); color: var(--accent); }
        .status-diagnosing { background: #7C2D12; color: var(--warning); }
        .status-repairing { background: #7C2D12; color: var(--warning); }
        .status-testing { background: #065F46; color: var(--success); }
        .status-ready { background: #065F46; color: var(--success); }
        .status-completed { background: var(--surface-5); color: var(--text-secondary); }

        .admin-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding-left: 2.75rem;
        }

        .orders-grid {
            display: grid;
            gap: var(--space-lg);
        }

        .order-card {
            background: var(--surface-2);
            border: 1px solid var(--surface-4);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .order-card:hover {
            background: var(--surface-3);
            border-color: var(--surface-5);
            transform: translateX(4px);
            box-shadow: -4px 0 16px rgba(56, 189, 248, 0.1);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--space-md);
        }

        .order-id {
            font-weight: 600;
            color: var(--accent);
            font-size: 0.875rem;
            margin-bottom: var(--space-xs);
        }

        .order-details {
            display: grid;
            gap: var(--space-xs);
            font-size: 0.875rem;
        }

        .order-device {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .order-phone { color: var(--text-secondary); }
        .order-issue { color: var(--text-dim); }

        .order-cost {
            color: var(--accent);
            font-size: 1.25rem;
            font-weight: 600;
        }

        .back-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--surface-4);
            margin-bottom: var(--space-xl);
        }

        .back-btn:hover {
            background: var(--surface-3);
            color: var(--text-primary);
            border-color: var(--surface-5);
            transform: translateY(0);
        }

        .empty-state {
            text-align: center;
            padding: var(--space-2xl);
            color: var(--text-secondary);
        }

        .error-message {
            background: rgba(124, 45, 18, 0.2);
            border: 1px solid #7C2D12;
            color: var(--warning);
            padding: var(--space-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-lg);
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box { max-width: none; }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div id="root"></div>

    <script>
        // Auth check
        (function() {
            const authData = localStorage.getItem('adminAuth');
            if (!authData) {
                window.location.href = 'login-admin.html';
                return;
            }
            try {
                const parsed = JSON.parse(authData);
                if (!parsed.isAdmin || (Date.now() - parsed.loginTime >= 1800000)) {
                    localStorage.removeItem('adminAuth');
                    window.location.href = 'login-admin.html';
                    return;
                }
                parsed.loginTime = Date.now();
                localStorage.setItem('adminAuth', JSON.stringify(parsed));
            } catch (e) {
                localStorage.removeItem('adminAuth');
                window.location.href = 'login-admin.html';
            }
        })();

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCpUn1ch7sI1vNWnrX4HMG024J3vfmJHXQ",
            authDomain: "repair-tracker-e8486.firebaseapp.com",
            projectId: "repair-tracker-e8486",
            storageBucket: "repair-tracker-e8486.firebasestorage.app",
            messagingSenderId: "967280277566",
            appId: "1:967280277566:web:bccbba44dc9ecf4ad6396f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Particles
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.mouse = { x: null, y: null };
                this.particleCount = 80;
                this.maxDistance = 150;
                this.mouseRadius = 200;

                this.resize();
                this.init();
                this.animate();

                window.addEventListener('resize', () => this.resize());
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                });
                window.addEventListener('mouseout', () => {
                    this.mouse.x = null;
                    this.mouse.y = null;
                });
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                this.particles = [];
                for (let i = 0; i < this.particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        radius: Math.random() * 2 + 1
                    });
                }
            }

            drawParticle(particle) {
                this.ctx.beginPath();
                this.ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                this.ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
                this.ctx.fill();
            }

            drawLine(p1, p2, distance) {
                const opacity = 1 - (distance / this.maxDistance);
                this.ctx.beginPath();
                this.ctx.moveTo(p1.x, p1.y);
                this.ctx.lineTo(p2.x, p2.y);
                this.ctx.strokeStyle = `rgba(56, 189, 248, ${opacity * 0.2})`;
                this.ctx.lineWidth = 0.5;
                this.ctx.stroke();
            }

            update() {
                for (let particle of this.particles) {
                    if (this.mouse.x !== null && this.mouse.y !== null) {
                        const dx = this.mouse.x - particle.x;
                        const dy = this.mouse.y - particle.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < this.mouseRadius) {
                            const force = (1 - distance / this.mouseRadius) * 0.02;
                            particle.vx += dx * force;
                            particle.vy += dy * force;
                        }
                    }

                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vx *= 0.98;
                    particle.vy *= 0.98;
                    particle.vx += (Math.random() - 0.5) * 0.1;
                    particle.vy += (Math.random() - 0.5) * 0.1;

                    const maxVel = 2;
                    const vel = Math.sqrt(particle.vx ** 2 + particle.vy ** 2);
                    if (vel > maxVel) {
                        particle.vx = (particle.vx / vel) * maxVel;
                        particle.vy = (particle.vy / vel) * maxVel;
                    }

                    if (particle.x < 0 || particle.x > this.canvas.width) {
                        particle.vx *= -1;
                        particle.x = Math.max(0, Math.min(this.canvas.width, particle.x));
                    }
                    if (particle.y < 0 || particle.y > this.canvas.height) {
                        particle.vy *= -1;
                        particle.y = Math.max(0, Math.min(this.canvas.height, particle.y));
                    }
                }
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = 0; i < this.particles.length; i++) {
                    for (let j = i + 1; j < this.particles.length; j++) {
                        const dx = this.particles[i].x - this.particles[j].x;
                        const dy = this.particles[i].y - this.particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < this.maxDistance) {
                            this.drawLine(this.particles[i], this.particles[j], distance);
                        }
                    }
                }

                for (let particle of this.particles) {
                    this.drawParticle(particle);
                }
            }

            animate() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        const canvas = document.getElementById('particles-canvas');
        new ParticleSystem(canvas);
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const STATUS_LABELS = {
            received: 'Принят',
            diagnosing: 'Диагностика',
            repairing: 'Ремонт',
            testing: 'Тестирование',
            ready: 'Готов к выдаче',
            completed: 'Выдан'
        };

        function App() {
            return (
                <div className="app">
                    <div className="container">
                        <AdminView />
                    </div>
                </div>
            );
        }

        function AdminView() {
            const [view, setView] = useState('list');
            const [orders, setOrders] = useState([]);
            const [filteredOrders, setFilteredOrders] = useState([]);
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [searchPhone, setSearchPhone] = useState('');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                loadOrders();
            }, []);

            useEffect(() => {
                if (searchPhone.trim() === '') {
                    setFilteredOrders(orders);
                } else {
                    const filtered = orders.filter(o => o.phone && o.phone.includes(searchPhone));
                    setFilteredOrders(filtered);
                }
            }, [searchPhone, orders]);

            const loadOrders = async () => {
                setLoading(true);
                try {
                    const snapshot = await db.collection('orders').orderBy('createdAt', 'desc').get();
                    const allOrders = [];
                    snapshot.forEach(doc => {
                        allOrders.push({ id: doc.id, ...doc.data() });
                    });
                    setOrders(allOrders);
                    setFilteredOrders(allOrders);
                } catch (error) {
                    console.error('Error loading orders:', error);
                }
                setLoading(false);
            };

            const handleEdit = (order) => {
                setSelectedOrder(order);
                setView('edit');
            };

            const handleCreate = () => {
                setSelectedOrder({
                    phone: '',
                    device: '',
                    issue: '',
                    status: 'received',
                    notes: '',
                    estimatedCost: ''
                });
                setView('create');
            };

            const handleBack = () => {
                setView('list');
                setSelectedOrder(null);
                loadOrders();
            };

            const handleLogout = () => {
                localStorage.removeItem('adminAuth');
                window.location.href = 'login-admin.html';
            };

            return (
                <>
                    <div style={{ display: 'flex', gap: 'var(--space-sm)', marginBottom: 'var(--space-xl)' }}>
                        <button className="btn back-btn btn-small" onClick={handleLogout}>
                            ← Выход
                        </button>
                    </div>

                    {view === 'list' && (
                        <OrdersList
                            orders={filteredOrders}
                            loading={loading}
                            onEdit={handleEdit}
                            onCreate={handleCreate}
                            searchPhone={searchPhone}
                            setSearchPhone={setSearchPhone}
                        />
                    )}

                    {view === 'edit' && (
                        <OrderForm
                            order={selectedOrder}
                            onBack={handleBack}
                            mode="edit"
                        />
                    )}

                    {view === 'create' && (
                        <OrderForm
                            order={selectedOrder}
                            onBack={handleBack}
                            mode="create"
                        />
                    )}
                </>
            );
        }

        function OrdersList({ orders, loading, onEdit, onCreate, searchPhone, setSearchPhone }) {
            return (
                <div>
                    <div className="admin-header">
                        <h2 className="card-title">Все заказы ({orders.length})</h2>

                        <div className="search-box">
                            <span className="search-icon">🔍</span>
                            <input
                                type="text"
                                className="input search-input"
                                placeholder="Поиск по телефону..."
                                value={searchPhone}
                                onChange={(e) => setSearchPhone(e.target.value)}
                            />
                        </div>

                        <button className="btn btn-small" onClick={onCreate}>
                            + Новый заказ
                        </button>
                    </div>

                    {loading ? (
                        <div className="empty-state">
                            <p>Загрузка заказов...</p>
                        </div>
                    ) : orders.length === 0 ? (
                        <div className="empty-state">
                            <p>{searchPhone ? 'Заказы не найдены' : 'Пока нет заказов'}</p>
                        </div>
                    ) : (
                        <div className="orders-grid">
                            {orders.map(order => (
                                <div key={order.id} className="order-card" onClick={() => onEdit(order)}>
                                    <div className="order-header">
                                        <div>
                                            <div className="order-id">#{order.id.substring(0, 8)}</div>
                                            <span className={`status-badge status-${order.status}`}>
                                                {STATUS_LABELS[order.status]}
                                            </span>
                                        </div>
                                        {order.estimatedCost && (
                                            <div className="order-cost">
                                                {order.estimatedCost} ₽
                                            </div>
                                        )}
                                    </div>
                                    <div className="order-details">
                                        <div className="order-device">{order.device}</div>
                                        <div className="order-phone">{order.phone}</div>
                                        <div className="order-issue">{order.issue}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function OrderForm({ order, onBack, mode }) {
            const [formData, setFormData] = useState(order);
            const [error, setError] = useState('');
            const [saving, setSaving] = useState(false);

            const handleChange = (field, value) => {
                setFormData({ ...formData, [field]: value });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');

                if (!formData.phone || !formData.device || !formData.issue) {
                    setError('Заполните все обязательные поля');
                    return;
                }

                setSaving(true);

                try {
                    if (mode === 'create') {
                        await db.collection('orders').add({
                            ...formData,
                            createdAt: new Date().toISOString(),
                            updatedAt: new Date().toISOString()
                        });
                    } else {
                        await db.collection('orders').doc(order.id).update({
                            ...formData,
                            updatedAt: new Date().toISOString()
                        });
                    }
                    onBack();
                } catch (error) {
                    console.error('Error saving order:', error);
                    setError('Ошибка при сохранении заказа');
                    setSaving(false);
                }
            };

            return (
                <>
                    <button className="btn back-btn btn-small" onClick={onBack}>
                        ← Назад к списку
                    </button>

                    <div className="card">
                        <div className="card-header">
                            <h2 className="card-title">
                                {mode === 'create' ? 'Новый заказ' : `Заказ #${order.id.substring(0, 8)}`}
                            </h2>
                        </div>

                        {error && <div className="error-message">{error}</div>}

                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="label">Телефон клиента *</label>
                                <input
                                    type="tel"
                                    className="input"
                                    placeholder="+7 (___) ___-__-__"
                                    value={formData.phone}
                                    onChange={(e) => handleChange('phone', e.target.value)}
                                    required
                                />
                            </div>

                            <div className="form-group">
                                <label className="label">Инструмент *</label>
                                <input
                                    type="text"
                                    className="input"
                                    placeholder="Например: Дрель Makita HP457D"
                                    value={formData.device}
                                    onChange={(e) => handleChange('device', e.target.value)}
                                    required
                                />
                            </div>

                            <div className="form-group">
                                <label className="label">Описание поломки *</label>
                                <textarea
                                    className="input textarea"
                                    placeholder="Опишите проблему..."
                                    value={formData.issue}
                                    onChange={(e) => handleChange('issue', e.target.value)}
                                    required
                                />
                            </div>

                            <div className="form-group">
                                <label className="label">Статус</label>
                                <select
                                    className="input select"
                                    value={formData.status}
                                    onChange={(e) => handleChange('status', e.target.value)}
                                >
                                    {Object.entries(STATUS_LABELS).map(([value, label]) => (
                                        <option key={value} value={value}>{label}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="form-group">
                                <label className="label">Примерная стоимость (₽)</label>
                                <input
                                    type="number"
                                    className="input"
                                    placeholder="5000"
                                    value={formData.estimatedCost}
                                    onChange={(e) => handleChange('estimatedCost', e.target.value)}
                                />
                            </div>

                            <div className="form-group">
                                <label className="label">Примечания</label>
                                <textarea
                                    className="input textarea"
                                    placeholder="Дополнительная информация..."
                                    value={formData.notes}
                                    onChange={(e) => handleChange('notes', e.target.value)}
                                />
                            </div>

                            <button type="submit" className="btn" disabled={saving}>
                                {saving ? 'Сохранение...' : mode === 'create' ? 'Создать заказ' : 'Сохранить изменения'}
                            </button>
                        </form>
                    </div>
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
