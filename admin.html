<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Админ-Панель — Ремонт Инструмента</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-red: #D32F2F;
            --color-blue: #0097A7;
            --color-yellow: #F9A825;
            --color-green: #43A047;
            --color-dark: #37474F;
            --color-background: #ECEFF1;
            --color-white: #FFFFFF;
            --color-light-gray: #CFD8DC;
            --color-text: #263238;
            --color-text-light: #546E7A;
            --font-heading: 'Oswald', sans-serif;
            --font-body: 'Roboto', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Страница скрыта, пока не подтверждена авторизация.
           Снимается классом .auth-ok — так содержимое не мелькает
           до срабатывания проверки. */
        html { visibility: hidden; }
        html.auth-ok { visibility: visible; }

        body {
            font-family: var(--font-body);
            background: var(--color-background);
            color: var(--color-text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .app {
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: var(--color-white);
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg,
                var(--color-red) 0%,
                var(--color-red) 33%,
                var(--color-blue) 33%,
                var(--color-blue) 66%,
                var(--color-yellow) 66%,
                var(--color-yellow) 100%
            );
        }

        .header-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 700;
            color: var(--color-dark);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* ===== ВКЛАДКИ ===== */
        .tabs {
            display: flex;
            gap: 0.25rem;
            margin-bottom: 2rem;
            border-bottom: 3px solid var(--color-light-gray);
            flex-wrap: wrap;
        }

        .tab {
            font-family: var(--font-heading);
            font-size: 0.9375rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--color-text-light);
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            margin-bottom: -3px;
            padding: 0.85rem 1.5rem;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .tab:hover { color: var(--color-dark); }

        .tab.active {
            color: var(--color-red);
            border-bottom-color: var(--color-red);
        }

        .tab:focus-visible {
            outline: 3px solid var(--color-dark);
            outline-offset: -3px;
        }

        .tab-count {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-left: 0.35rem;
        }

        /* ===== ЛЕНТА РАБОТ (админ) ===== */
        .work-form {
            background: var(--color-white);
            padding: 2rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            position: relative;
            margin-bottom: 2rem;
        }

        .work-form::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: var(--color-red);
        }

        .drop-zone {
            border: 2px dashed var(--color-light-gray);
            background: var(--color-background);
            padding: 1.75rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease, background 0.2s ease;
            margin-bottom: 1rem;
        }

        .drop-zone:hover,
        .drop-zone.dragging {
            border-color: var(--color-red);
            background: rgba(211, 47, 47, 0.04);
        }

        .drop-zone svg {
            width: 36px;
            height: 36px;
            stroke: var(--color-text-light);
            fill: none;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            margin-bottom: 0.6rem;
        }

        .drop-zone-text {
            color: var(--color-dark);
            font-weight: 500;
            font-size: 0.9375rem;
        }

        .drop-zone-hint {
            color: var(--color-text-light);
            font-size: 0.8125rem;
            font-weight: 300;
            margin-top: 0.25rem;
        }

        .photo-preview {
            position: relative;
            margin-bottom: 1rem;
            background: var(--color-background);
        }

        .photo-preview img {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            display: block;
        }

        .photo-remove {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(38, 50, 56, 0.85);
            color: var(--color-white);
            border: none;
            width: 36px;
            height: 36px;
            font-size: 1.25rem;
            line-height: 1;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background 0.2s ease;
        }

        .photo-remove:hover { background: var(--color-red); }

        .works-admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.25rem;
        }

        .work-admin-card {
            background: var(--color-white);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border-top: 4px solid var(--color-blue);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .work-admin-photo {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: var(--color-background);
            overflow: hidden;
        }

        .work-admin-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .work-admin-body {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .work-admin-title {
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 600;
            color: var(--color-dark);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .work-admin-text {
            color: var(--color-text-light);
            font-size: 0.875rem;
            font-weight: 300;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .work-admin-date {
            margin-top: auto;
            padding-top: 0.5rem;
            border-top: 1px solid var(--color-light-gray);
            font-size: 0.75rem;
            color: var(--color-text-light);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .work-delete {
            background: transparent;
            border: 2px solid var(--color-light-gray);
            color: var(--color-text-light);
            font-family: var(--font-heading);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .work-delete:hover {
            background: var(--color-red);
            border-color: var(--color-red);
            color: var(--color-white);
        }

        .work-delete:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar {
            height: 4px;
            background: var(--color-light-gray);
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-bar span {
            display: block;
            height: 100%;
            background: var(--color-red);
            transition: width 0.2s ease;
        }

        .field-hint {
            color: var(--color-text-light);
            font-size: 0.75rem;
            font-weight: 300;
            margin-top: 0.35rem;
        }

        .toast {
            background: var(--color-green);
            color: var(--color-white);
            padding: 0.9rem 1.25rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
            font-size: 0.9375rem;
        }

        .card {
            background: var(--color-white);
            padding: 2.5rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 8px;
            height: 100%;
            background: linear-gradient(180deg,
                var(--color-red) 0%,
                var(--color-red) 25%,
                var(--color-blue) 25%,
                var(--color-blue) 50%,
                var(--color-yellow) 50%,
                var(--color-yellow) 75%,
                var(--color-dark) 75%,
                var(--color-dark) 100%
            );
        }

        .card-header { margin-bottom: 2rem; }

        .card-title {
            font-family: var(--font-heading);
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--color-dark);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .card-subtitle {
            color: var(--color-text-light);
            font-size: 0.875rem;
            font-weight: 300;
        }

        .form-group { margin-bottom: 1.5rem; }

        .label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-dark);
            font-weight: 500;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input, .textarea, .select {
            width: 100%;
            background: var(--color-white);
            border: 2px solid var(--color-light-gray);
            border-radius: 0;
            padding: 1rem;
            color: var(--color-text);
            font-size: 1rem;
            font-family: var(--font-body);
            transition: all 0.2s ease;
        }

        .input:hover, .textarea:hover, .select:hover {
            border-color: var(--color-text-light);
        }

        .input:focus, .textarea:focus, .select:focus {
            outline: none;
            border-color: var(--color-red);
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
        }

        .textarea {
            min-height: 100px;
            resize: vertical;
        }

        .select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23546E7A' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            padding-right: 2.5rem;
        }

        .btn {
            background: var(--color-red);
            color: var(--color-white);
            border: none;
            border-radius: 0;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            min-height: 56px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: #B71C1C;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
        }

        .btn:focus {
            outline: 3px solid var(--color-dark);
            outline-offset: 2px;
        }

        .btn:disabled {
            background: var(--color-light-gray);
            color: var(--color-text-light);
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--color-dark);
        }

        .btn-secondary:hover {
            background: #263238;
        }

        .btn-small {
            padding: 0.75rem 1.5rem;
            font-size: 0.875rem;
            width: auto;
            min-height: auto;
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 0;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-family: var(--font-heading);
        }

        .status-received { background: var(--color-blue); color: var(--color-white); }
        .status-diagnosing { background: var(--color-yellow); color: var(--color-dark); }
        .status-repairing { background: var(--color-red); color: var(--color-white); }
        .status-testing { background: var(--color-dark); color: var(--color-white); }
        .status-ready { background: #43A047; color: var(--color-white); }
        .status-completed { background: var(--color-light-gray); color: var(--color-text); }

        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
        }

        .search-input { width: 100%; }

        .orders-grid {
            display: grid;
            gap: 1.5rem;
        }

        .order-card {
            background: var(--color-white);
            border-left: 6px solid var(--color-blue);
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .order-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            transform: translateX(4px);
            border-left-color: var(--color-red);
        }

        .order-card:focus {
            outline: 3px solid var(--color-dark);
            outline-offset: 2px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .order-id {
            font-weight: 600;
            color: var(--color-text-light);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .order-details {
            display: grid;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .order-device {
            font-weight: 700;
            font-size: 1.125rem;
            color: var(--color-dark);
            font-family: var(--font-heading);
            text-transform: uppercase;
        }

        .order-phone { color: var(--color-text-light); font-weight: 500; }
        .order-issue { color: var(--color-text-light); }

        .order-cost {
            color: var(--color-red);
            font-size: 1.5rem;
            font-weight: 700;
            font-family: var(--font-heading);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--color-text-light);
            font-weight: 300;
        }

        .error-message {
            background: rgba(211, 47, 47, 0.1);
            border: 2px solid var(--color-red);
            color: var(--color-red);
            padding: 1rem;
            border-radius: 0;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box { max-width: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // ============================================================
        // ЗАЩИТА СТРАНИЦЫ. Выполняется до отрисовки контента.
        // Пока проверка не пройдена — страница остаётся невидимой.
        // ============================================================
        (function() {
            var SESSION_KEY = 'rt_admin_session';
            var SESSION_TTL = 30 * 60 * 1000; // 30 минут неактивности
            var raw = sessionStorage.getItem(SESSION_KEY);

            function deny() {
                try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
                window.location.replace('login-admin.html');
            }

            if (!raw) { deny(); return; }

            try {
                var s = JSON.parse(raw);
                if (!s || s.ok !== true || typeof s.ts !== 'number') { deny(); return; }
                if (Date.now() - s.ts >= SESSION_TTL) { deny(); return; }

                // Продлеваем сессию активности
                sessionStorage.setItem(SESSION_KEY, JSON.stringify({ ok: true, ts: Date.now() }));

                // Снимаем блокировку отображения и запрещаем кэширование
                document.documentElement.className += ' auth-ok';
            } catch (e) {
                deny();
            }
        })();

        const firebaseConfig = {
            apiKey: "AIzaSyCpUn1ch7sI1vNWnrX4HMG024J3vfmJHXQ",
            authDomain: "repair-tracker-e8486.firebaseapp.com",
            projectId: "repair-tracker-e8486",
            storageBucket: "repair-tracker-e8486.firebasestorage.app",
            messagingSenderId: "967280277566",
            appId: "1:967280277566:web:bccbba44dc9ecf4ad6396f"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const STATUS_LABELS = {
            received: 'Принят',
            diagnosing: 'Диагностика',
            repairing: 'Ремонт',
            testing: 'Тестирование',
            ready: 'Готов',
            completed: 'Выдан'
        };

        function App() {
            return (
                <div className="app">
                    <div className="container">
                        <AdminView />
                    </div>
                </div>
            );
        }

        function AdminView() {
            const [tab, setTab] = useState('orders');
            const [view, setView] = useState('list');
            const [orders, setOrders] = useState([]);
            const [filteredOrders, setFilteredOrders] = useState([]);
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [searchPhone, setSearchPhone] = useState('');
            const [loading, setLoading] = useState(true);
            const [works, setWorks] = useState([]);
            const [worksLoading, setWorksLoading] = useState(true);
            const [toast, setToast] = useState('');

            useEffect(() => {
                loadOrders();
                loadWorks();
            }, []);

            useEffect(() => {
                if (searchPhone.trim() === '') {
                    setFilteredOrders(orders);
                } else {
                    const filtered = orders.filter(o => o.phone && o.phone.includes(searchPhone));
                    setFilteredOrders(filtered);
                }
            }, [searchPhone, orders]);

            useEffect(() => {
                if (!toast) return;
                const t = setTimeout(() => setToast(''), 3000);
                return () => clearTimeout(t);
            }, [toast]);

            const loadOrders = async () => {
                setLoading(true);
                try {
                    const snapshot = await db.collection('orders').orderBy('createdAt', 'desc').get();
                    const allOrders = [];
                    snapshot.forEach(doc => {
                        allOrders.push({ id: doc.id, ...doc.data() });
                    });
                    setOrders(allOrders);
                    setFilteredOrders(allOrders);
                } catch (error) {
                    console.error('Error loading orders:', error);
                }
                setLoading(false);
            };

            const loadWorks = async () => {
                setWorksLoading(true);
                try {
                    const snapshot = await db.collection('works').orderBy('createdAt', 'desc').get();
                    const items = [];
                    snapshot.forEach(doc => {
                        items.push({ id: doc.id, ...doc.data() });
                    });
                    setWorks(items);
                } catch (error) {
                    console.error('Error loading works:', error);
                }
                setWorksLoading(false);
            };

            const handleEdit = (order) => {
                setSelectedOrder(order);
                setView('edit');
            };

            const handleCreate = () => {
                setSelectedOrder({
                    phone: '',
                    device: '',
                    issue: '',
                    status: 'received',
                    notes: '',
                    estimatedCost: ''
                });
                setView('create');
            };

            const handleBack = () => {
                setView('list');
                setSelectedOrder(null);
                loadOrders();
            };

            const handleLogout = () => {
                try { sessionStorage.removeItem('rt_admin_session'); } catch (e) {}
                window.location.replace('login-admin.html');
            };

            // Формы заказа — отдельный экран без вкладок
            if (view === 'edit' || view === 'create') {
                return (
                    <OrderForm
                        order={selectedOrder}
                        onBack={handleBack}
                        mode={view}
                    />
                );
            }

            return (
                <>
                    <div className="tabs" role="tablist">
                        <button
                            role="tab"
                            aria-selected={tab === 'orders'}
                            className={'tab' + (tab === 'orders' ? ' active' : '')}
                            onClick={() => setTab('orders')}
                        >
                            Заказы<span className="tab-count">({filteredOrders.length})</span>
                        </button>
                        <button
                            role="tab"
                            aria-selected={tab === 'works'}
                            className={'tab' + (tab === 'works' ? ' active' : '')}
                            onClick={() => setTab('works')}
                        >
                            Работы<span className="tab-count">({works.length})</span>
                        </button>
                    </div>

                    {toast && <div className="toast">{toast}</div>}

                    {tab === 'orders' && (
                        <>
                            <div className="header">
                                <h1 className="header-title">Заказы ({filteredOrders.length})</h1>

                                <div style={{ display: 'flex', gap: '1rem', alignItems: 'center', flexWrap: 'wrap' }}>
                                    <div className="search-box">
                                        <input
                                            type="text"
                                            className="input search-input"
                                            placeholder="Поиск по телефону..."
                                            value={searchPhone}
                                            onChange={(e) => setSearchPhone(e.target.value)}
                                            aria-label="Поиск по телефону"
                                        />
                                    </div>

                                    <button className="btn btn-small" onClick={handleCreate}>
                                        + Новый
                                    </button>

                                    <button className="btn btn-secondary btn-small" onClick={handleLogout}>
                                        Выход
                                    </button>
                                </div>
                            </div>

                            {loading ? (
                                <div className="empty-state">
                                    <p>Загрузка...</p>
                                </div>
                            ) : filteredOrders.length === 0 ? (
                                <div className="empty-state">
                                    <p>{searchPhone ? 'Не найдено' : 'Нет заказов'}</p>
                                </div>
                            ) : (
                                <div className="orders-grid">
                                    {filteredOrders.map(order => (
                                        <div
                                            key={order.id}
                                            className="order-card"
                                            onClick={() => handleEdit(order)}
                                            role="button"
                                            tabIndex="0"
                                            onKeyPress={(e) => {
                                                if (e.key === 'Enter' || e.key === ' ') {
                                                    e.preventDefault();
                                                    handleEdit(order);
                                                }
                                            }}
                                        >
                                            <div className="order-header">
                                                <div>
                                                    <div className="order-id">#{order.id.substring(0, 12)}</div>
                                                    <span className={`status-badge status-${order.status}`}>
                                                        {STATUS_LABELS[order.status]}
                                                    </span>
                                                </div>
                                                {order.estimatedCost && (
                                                    <div className="order-cost">
                                                        {order.estimatedCost} ₽
                                                    </div>
                                                )}
                                            </div>
                                            <div className="order-details">
                                                <div className="order-device">{order.device}</div>
                                                <div className="order-phone">{order.phone}</div>
                                                <div className="order-issue">{order.issue}</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </>
                    )}

                    {tab === 'works' && (
                        <WorksPanel
                            works={works}
                            loading={worksLoading}
                            onReload={loadWorks}
                            onToast={setToast}
                            onLogout={handleLogout}
                        />
                    )}
                </>
            );
        }

        // ============================================================
        // РАЗДЕЛ «РАБОТЫ» — фото + текст для ленты на главной
        // ============================================================

        const MAX_UPLOAD_BYTES = 700 * 1024; // ~700 КБ после сжатия
        const PHOTO_MAX_SIDE = 1200;

        // Сжатие фото в браузере, чтобы уложиться в лимит документа Firestore (1 МБ)
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = (ev) => {
                    const img = new Image();

                    img.onload = () => {
                        let { width, height } = img;

                        if (width > height && width > PHOTO_MAX_SIDE) {
                            height = Math.round(height * (PHOTO_MAX_SIDE / width));
                            width = PHOTO_MAX_SIDE;
                        } else if (height > PHOTO_MAX_SIDE) {
                            width = Math.round(width * (PHOTO_MAX_SIDE / height));
                            height = PHOTO_MAX_SIDE;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        // Заливаем белым: у PNG с прозрачностью иначе чёрный фон
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);

                        // Подбираем качество JPEG, пока не уложимся в лимит
                        let quality = 0.82;
                        let dataUrl = canvas.toDataURL('image/jpeg', quality);

                        while (dataUrl.length * 0.75 > MAX_UPLOAD_BYTES && quality > 0.3) {
                            quality -= 0.1;
                            dataUrl = canvas.toDataURL('image/jpeg', quality);
                        }

                        if (dataUrl.length * 0.75 > MAX_UPLOAD_BYTES) {
                            reject(new Error('too-large'));
                            return;
                        }

                        resolve(dataUrl);
                    };

                    img.onerror = () => reject(new Error('bad-image'));
                    img.src = ev.target.result;
                };

                reader.onerror = () => reject(new Error('read-error'));
                reader.readAsDataURL(file);
            });
        }

        function WorksPanel({ works, loading, onReload, onToast, onLogout }) {
            const [title, setTitle] = useState('');
            const [text, setText] = useState('');
            const [photo, setPhoto] = useState('');
            const [busy, setBusy] = useState(false);
            const [error, setError] = useState('');
            const [dragging, setDragging] = useState(false);
            const [deleting, setDeleting] = useState(null);
            const fileInput = React.useRef(null);

            const handleFile = async (file) => {
                if (!file) return;
                setError('');

                if (!file.type.startsWith('image/')) {
                    setError('Выберите файл изображения (JPG, PNG)');
                    return;
                }

                try {
                    const dataUrl = await compressImage(file);
                    setPhoto(dataUrl);
                } catch (err) {
                    if (err && err.message === 'too-large') {
                        setError('Фото слишком большое даже после сжатия. Попробуйте другое.');
                    } else {
                        setError('Не удалось обработать изображение');
                    }
                }
            };

            const onDrop = (e) => {
                e.preventDefault();
                setDragging(false);
                const file = e.dataTransfer.files && e.dataTransfer.files[0];
                handleFile(file);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');

                if (!photo) {
                    setError('Добавьте фотографию работы');
                    return;
                }
                if (!title.trim() && !text.trim()) {
                    setError('Добавьте заголовок или описание');
                    return;
                }

                setBusy(true);

                try {
                    await db.collection('works').add({
                        title: title.trim(),
                        text: text.trim(),
                        photo,
                        createdAt: new Date().toISOString()
                    });

                    setTitle('');
                    setText('');
                    setPhoto('');
                    if (fileInput.current) fileInput.current.value = '';
                    onToast('Работа опубликована');
                    await onReload();
                } catch (err) {
                    console.error('Error saving work:', err);
                    setError('Не удалось сохранить. Проверьте соединение.');
                }

                setBusy(false);
            };

            const handleDelete = async (work) => {
                if (!window.confirm('Удалить эту работу? Действие необратимо.')) return;

                setDeleting(work.id);
                try {
                    await db.collection('works').doc(work.id).delete();
                    onToast('Работа удалена');
                    await onReload();
                } catch (err) {
                    console.error('Error deleting work:', err);
                    setError('Не удалось удалить работу');
                }
                setDeleting(null);
            };

            return (
                <>
                    <div className="header">
                        <h1 className="header-title">Работы ({works.length})</h1>
                        <button className="btn btn-secondary btn-small" onClick={onLogout}>
                            Выход
                        </button>
                    </div>

                    <form className="work-form" onSubmit={handleSubmit}>
                        <h2 className="card-title" style={{ fontSize: '1.375rem', marginBottom: '1.25rem' }}>
                            Добавить работу
                        </h2>

                        {error && <div className="error-message">{error}</div>}

                        {photo ? (
                            <div className="photo-preview">
                                <img src={photo} alt="Предпросмотр" />
                                <button
                                    type="button"
                                    className="photo-remove"
                                    onClick={() => {
                                        setPhoto('');
                                        if (fileInput.current) fileInput.current.value = '';
                                    }}
                                    aria-label="Убрать фото"
                                >
                                    ×
                                </button>
                            </div>
                        ) : (
                            <div
                                className={'drop-zone' + (dragging ? ' dragging' : '')}
                                onClick={() => fileInput.current && fileInput.current.click()}
                                onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
                                onDragLeave={() => setDragging(false)}
                                onDrop={onDrop}
                                role="button"
                                tabIndex="0"
                                onKeyPress={(e) => {
                                    if (e.key === 'Enter' || e.key === ' ') {
                                        e.preventDefault();
                                        fileInput.current && fileInput.current.click();
                                    }
                                }}
                            >
                                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                                <div className="drop-zone-text">Нажмите или перетащите фото</div>
                                <div className="drop-zone-hint">JPG или PNG — сожмётся автоматически</div>
                            </div>
                        )}

                        <input
                            ref={fileInput}
                            type="file"
                            accept="image/*"
                            onChange={(e) => handleFile(e.target.files && e.target.files[0])}
                            style={{ display: 'none' }}
                        />

                        <div className="form-group">
                            <label className="label" htmlFor="w-title">Заголовок</label>
                            <input
                                id="w-title"
                                type="text"
                                className="input"
                                placeholder="Например: Ремонт бензопилы Stihl MS 180"
                                value={title}
                                onChange={(e) => setTitle(e.target.value)}
                                maxLength={120}
                            />
                        </div>

                        <div className="form-group">
                            <label className="label" htmlFor="w-text">Что сделали</label>
                            <textarea
                                id="w-text"
                                className="textarea"
                                placeholder="Кратко опишите выполненную работу: что было не так и что заменили"
                                value={text}
                                onChange={(e) => setText(e.target.value)}
                                rows={5}
                                maxLength={1500}
                            />
                            <div className="field-hint">{text.length} / 1500</div>
                        </div>

                        <button type="submit" className="btn" disabled={busy}>
                            {busy ? 'Публикация...' : 'Опубликовать'}
                        </button>
                    </form>

                    <h2 className="card-title" style={{ fontSize: '1.375rem', marginBottom: '1.25rem' }}>
                        Опубликованные работы
                    </h2>

                    {loading ? (
                        <div className="empty-state"><p>Загрузка...</p></div>
                    ) : works.length === 0 ? (
                        <div className="empty-state"><p>Пока нет опубликованных работ</p></div>
                    ) : (
                        <div className="works-admin-grid">
                            {works.map(work => (
                                <div className="work-admin-card" key={work.id}>
                                    {work.photo && (
                                        <div className="work-admin-photo">
                                            <img src={work.photo} alt={work.title || 'Работа'} loading="lazy" />
                                        </div>
                                    )}
                                    <div className="work-admin-body">
                                        {work.title && <div className="work-admin-title">{work.title}</div>}
                                        {work.text && <div className="work-admin-text">{work.text}</div>}
                                        <div className="work-admin-date">{formatDate(work.createdAt)}</div>
                                        <button
                                            className="work-delete"
                                            onClick={() => handleDelete(work)}
                                            disabled={deleting === work.id}
                                        >
                                            {deleting === work.id ? 'Удаление...' : 'Удалить'}
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </>
            );
        }

        function formatDate(value) {
            try {
                const d = new Date(value);
                if (isNaN(d.getTime())) return '';
                return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            } catch (e) {
                return '';
            }
        }

        function OrderForm({ order, onBack, mode }) {
            const [formData, setFormData] = useState(order);
            const [error, setError] = useState('');
            const [saving, setSaving] = useState(false);
            const [photos, setPhotos] = useState(order.photos || []);
            const [uploading, setUploading] = useState(false);
            const fileInput = React.useRef(null);

            const handleChange = (field, value) => {
                setFormData({ ...formData, [field]: value });
            };

            const handlePhotoFile = async (file) => {
                if (!file) return;
                setError('');

                if (!file.type.startsWith('image/')) {
                    setError('Выберите файл изображения (JPG, PNG)');
                    return;
                }

                setUploading(true);
                try {
                    const dataUrl = await compressImage(file);
                    setPhotos([...photos, dataUrl]);
                } catch (err) {
                    if (err && err.message === 'too-large') {
                        setError('Фото слишком большое даже после сжатия. Попробуйте другое.');
                    } else {
                        setError('Не удалось обработать изображение');
                    }
                }
                setUploading(false);
                if (fileInput.current) fileInput.current.value = '';
            };

            const handleRemovePhoto = (index) => {
                setPhotos(photos.filter((_, i) => i !== index));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');

                if (!formData.phone || !formData.device || !formData.issue) {
                    setError('Заполните все обязательные поля');
                    return;
                }

                setSaving(true);

                try {
                    const dataToSave = {
                        ...formData,
                        photos: photos,
                        updatedAt: new Date().toISOString()
                    };

                    if (mode === 'create') {
                        await db.collection('orders').add({
                            ...dataToSave,
                            createdAt: new Date().toISOString()
                        });
                    } else {
                        await db.collection('orders').doc(order.id).update(dataToSave);
                    }
                    onBack();
                } catch (error) {
                    console.error('Error saving order:', error);
                    setError('Ошибка при сохранении');
                    setSaving(false);
                }
            };

            return (
                <>
                    <button className="btn btn-secondary btn-small" onClick={onBack} style={{ marginBottom: '2rem', width: 'auto' }}>
                        ← Назад
                    </button>

                    <div className="card">
                        <div className="card-header">
                            <h2 className="card-title">
                                {mode === 'create' ? 'Новый Заказ' : `Заказ #${order.id.substring(0, 12)}`}
                            </h2>
                        </div>

                        {error && <div className="error-message">{error}</div>}

                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="label" htmlFor="phone">Телефон *</label>
                                <input
                                    id="phone"
                                    type="tel"
                                    className="input"
                                    placeholder="+7 (___) ___-__-__"
                                    value={formData.phone}
                                    onChange={(e) => handleChange('phone', e.target.value)}
                                    required
                                    aria-required="true"
                                />
                            </div>

                            <div className="form-group">
                                <label className="label" htmlFor="device">Инструмент *</label>
                                <input
                                    id="device"
                                    type="text"
                                    className="input"
                                    placeholder="Makita HP457D"
                                    value={formData.device}
                                    onChange={(e) => handleChange('device', e.target.value)}
                                    required
                                    aria-required="true"
                                />
                            </div>

                            <div className="form-group">
                                <label className="label" htmlFor="issue">Проблема *</label>
                                <textarea
                                    id="issue"
                                    className="textarea"
                                    placeholder="Описание..."
                                    value={formData.issue}
                                    onChange={(e) => handleChange('issue', e.target.value)}
                                    required
                                    aria-required="true"
                                />
                            </div>

                            <div className="form-group">
                                <label className="label" htmlFor="status">Статус</label>
                                <select
                                    id="status"
                                    className="select"
                                    value={formData.status}
                                    onChange={(e) => handleChange('status', e.target.value)}
                                >
                                    {Object.entries(STATUS_LABELS).map(([value, label]) => (
                                        <option key={value} value={value}>{label}</option>
                                    ))}
                                </select>
                            </div>

                            <div className="form-group">
                                <label className="label" htmlFor="cost">Стоимость (₽)</label>
                                <input
                                    id="cost"
                                    type="number"
                                    className="input"
                                    placeholder="5000"
                                    value={formData.estimatedCost}
                                    onChange={(e) => handleChange('estimatedCost', e.target.value)}
                                />
                            </div>

                            <div className="form-group">
                                <label className="label" htmlFor="completionDate">Дата выдачи</label>
                                <input
                                    id="completionDate"
                                    type="date"
                                    className="input"
                                    value={formData.completionDate || ''}
                                    onChange={(e) => handleChange('completionDate', e.target.value)}
                                />
                                <div className="field-hint">Ожидаемая или фактическая дата выдачи инструмента</div>
                            </div>

                            <div className="form-group">
                                <label className="label" htmlFor="notes">Примечания</label>
                                <textarea
                                    id="notes"
                                    className="textarea"
                                    placeholder="Доп. информация..."
                                    value={formData.notes}
                                    onChange={(e) => handleChange('notes', e.target.value)}
                                />
                            </div>

                            <div className="form-group">
                                <label className="label">Фото процесса ремонта</label>
                                <div className="field-hint" style={{ marginTop: '0', marginBottom: '0.75rem' }}>
                                    Клиент увидит эти фото в личном кабинете
                                </div>

                                {photos.length > 0 && (
                                    <div style={{ display: 'grid', gap: '1rem', marginBottom: '1rem' }}>
                                        {photos.map((photo, idx) => (
                                            <div key={idx} className="photo-preview">
                                                <img src={photo} alt={`Фото ${idx + 1}`} />
                                                <button
                                                    type="button"
                                                    className="photo-remove"
                                                    onClick={() => handleRemovePhoto(idx)}
                                                    aria-label="Убрать фото"
                                                >
                                                    ×
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                <button
                                    type="button"
                                    className="btn btn-secondary"
                                    onClick={() => fileInput.current && fileInput.current.click()}
                                    disabled={uploading}
                                >
                                    {uploading ? 'Обработка...' : '+ Добавить фото'}
                                </button>

                                <input
                                    ref={fileInput}
                                    type="file"
                                    accept="image/*"
                                    onChange={(e) => handlePhotoFile(e.target.files && e.target.files[0])}
                                    style={{ display: 'none' }}
                                />
                            </div>

                            <button type="submit" className="btn" disabled={saving}>
                                {saving ? 'Сохранение...' : mode === 'create' ? 'Создать' : 'Сохранить'}
                            </button>
                        </form>
                    </div>
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
