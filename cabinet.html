<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — Ремонт Инструмента</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-red: #D32F2F;
            --color-blue: #0097A7;
            --color-yellow: #F9A825;
            --color-green: #43A047;
            --color-dark: #37474F;
            --color-background: #ECEFF1;
            --color-white: #FFFFFF;
            --color-light-gray: #CFD8DC;
            --color-text: #263238;
            --color-text-light: #546E7A;

            --font-heading: 'Oswald', sans-serif;
            --font-body: 'Roboto', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--color-background);
            color: var(--color-text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.25rem;
        }

        /* ===== HEADER ===== */
        .header {
            background: var(--color-white);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top-bar {
            height: 4px;
            background: linear-gradient(90deg,
                var(--color-red) 0%, var(--color-red) 25%,
                var(--color-blue) 25%, var(--color-blue) 50%,
                var(--color-yellow) 50%, var(--color-yellow) 75%,
                var(--color-dark) 75%, var(--color-dark) 100%);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 1rem 0;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.375rem;
            font-weight: 700;
            color: var(--color-dark);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--color-red);
            display: grid;
            place-items: center;
            flex-shrink: 0;
            clip-path: polygon(18% 0%, 100% 0%, 82% 100%, 0% 100%);
        }

        .logo-icon svg {
            width: 22px;
            height: 22px;
            fill: var(--color-white);
        }

        .back-link {
            font-family: var(--font-heading);
            font-size: 0.8125rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--color-text-light);
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.2s ease;
        }

        .back-link:hover { color: var(--color-red); }

        /* ===== LAYOUT ===== */
        .page {
            padding: 3rem 0;
        }

        .panel {
            background: var(--color-white);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
            max-width: 520px;
            margin: 0 auto;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: linear-gradient(180deg,
                var(--color-red) 0%, var(--color-red) 25%,
                var(--color-blue) 25%, var(--color-blue) 50%,
                var(--color-yellow) 50%, var(--color-yellow) 75%,
                var(--color-dark) 75%, var(--color-dark) 100%);
        }

        .panel-title {
            font-family: var(--font-heading);
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            color: var(--color-dark);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 0.35rem;
        }

        .panel-subtitle {
            color: var(--color-text-light);
            font-size: 0.9375rem;
            font-weight: 300;
            margin-bottom: 2rem;
        }

        .form-group { margin-bottom: 1.25rem; }

        .label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-dark);
            font-weight: 500;
            font-size: 0.8125rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .input {
            width: 100%;
            background: var(--color-white);
            border: 2px solid var(--color-light-gray);
            padding: 0.9rem 1rem;
            color: var(--color-text);
            font-size: 1rem;
            font-family: var(--font-body);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input:hover { border-color: var(--color-text-light); }

        .input:focus {
            outline: none;
            border-color: var(--color-red);
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.12);
        }

        .input::placeholder { color: var(--color-text-light); }

        .btn {
            background: var(--color-red);
            color: var(--color-white);
            border: none;
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            min-height: 56px;
        }

        .btn:hover:not(:disabled) {
            background: #B71C1C;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(211, 47, 47, 0.3);
        }

        .btn:focus-visible {
            outline: 3px solid var(--color-dark);
            outline-offset: 2px;
        }

        .btn:disabled {
            background: var(--color-light-gray);
            color: var(--color-text-light);
            cursor: not-allowed;
            transform: none;
        }

        .btn-ghost {
            background: transparent;
            color: var(--color-text-light);
            border: 2px solid var(--color-light-gray);
            width: auto;
            min-height: auto;
            padding: 0.65rem 1.25rem;
            font-size: 0.8125rem;
        }

        .btn-ghost:hover:not(:disabled) {
            background: var(--color-dark);
            border-color: var(--color-dark);
            color: var(--color-white);
            transform: none;
            box-shadow: none;
        }

        .error {
            background: rgba(211, 47, 47, 0.08);
            border-left: 4px solid var(--color-red);
            color: var(--color-red);
            padding: 0.9rem 1rem;
            margin-bottom: 1.25rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .hint {
            color: var(--color-text-light);
            font-size: 0.8125rem;
            font-weight: 300;
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--color-light-gray);
        }

        /* ===== CABINET HEAD ===== */
        .cab-head {
            background: var(--color-white);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            border-top: 4px solid var(--color-blue);
        }

        .cab-title {
            font-family: var(--font-heading);
            font-size: clamp(1.375rem, 4vw, 1.75rem);
            font-weight: 700;
            color: var(--color-dark);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            line-height: 1.2;
        }

        .cab-phone {
            color: var(--color-text-light);
            font-size: 0.875rem;
            font-weight: 300;
        }

        .cab-phone strong {
            color: var(--color-dark);
            font-weight: 500;
        }

        /* ===== ORDERS ===== */
        .order {
            background: var(--color-white);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 1.5rem;
            border-left: 5px solid var(--color-blue);
            overflow: hidden;
        }

        .order-top {
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .order-num {
            font-family: var(--font-heading);
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--color-text-light);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.35rem;
        }

        .order-device {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-dark);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            line-height: 1.25;
        }

        .status-badge {
            display: inline-block;
            padding: 0.45rem 0.9rem;
            font-family: var(--font-heading);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }

        .status-received { background: var(--color-blue); color: var(--color-white); }
        .status-diagnosing { background: var(--color-yellow); color: var(--color-dark); }
        .status-repairing { background: var(--color-red); color: var(--color-white); }
        .status-testing { background: var(--color-dark); color: var(--color-white); }
        .status-ready { background: var(--color-green); color: var(--color-white); }
        .status-completed { background: var(--color-light-gray); color: var(--color-text); }

        /* Прогресс-шкала статусов */
        .steps {
            display: flex;
            padding: 0 1.5rem 1.25rem;
            gap: 0.35rem;
        }

        .step {
            flex: 1;
            height: 5px;
            background: var(--color-light-gray);
        }

        .step.done { background: var(--color-green); }
        .step.current { background: var(--color-red); }

        .order-info {
            padding: 0 1.5rem 1.5rem;
            display: grid;
            gap: 0.25rem;
        }

        .order-photos {
            padding: 0 1.5rem 1.5rem;
        }

        .photos-label {
            font-family: var(--font-heading);
            font-size: 0.8125rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--color-dark);
            margin-bottom: 0.75rem;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.75rem;
        }

        .order-photo-item {
            aspect-ratio: 4 / 3;
            background: var(--color-background);
            overflow: hidden;
            cursor: zoom-in;
            transition: opacity 0.2s ease;
        }

        .order-photo-item:hover {
            opacity: 0.85;
        }

        .order-photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(15, 20, 24, 0.92);
            z-index: 1000;
            display: grid;
            place-items: center;
            padding: 2rem 1rem;
            cursor: zoom-out;
            animation: fadeIn 0.2s ease;
        }

        .lightbox-content {
            position: relative;
            max-width: min(1100px, 100%);
            max-height: 88vh;
            display: grid;
            place-items: center;
        }

        .lightbox img {
            max-width: 100%;
            max-height: 88vh;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .lightbox-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: var(--color-white);
            width: 44px;
            height: 44px;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background 0.2s ease;
            z-index: 10;
        }

        .lightbox-close:hover {
            background: var(--color-red);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: var(--color-white);
            width: 50px;
            height: 50px;
            font-size: 1.75rem;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background 0.2s ease;
            z-index: 10;
        }

        .lightbox-nav:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.25);
        }

        .lightbox-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .lightbox-nav-prev { left: 1rem; }
        .lightbox-nav-next { right: 1rem; }

        .lightbox-counter {
            position: absolute;
            bottom: 1.25rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(38, 50, 56, 0.85);
            color: var(--color-white);
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .info-row {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 1rem;
            padding: 0.7rem 0;
            border-bottom: 1px solid var(--color-light-gray);
        }

        .info-row:last-child { border-bottom: none; }

        .info-label {
            color: var(--color-text-light);
            font-size: 0.8125rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-value {
            color: var(--color-dark);
            font-weight: 500;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .cost {
            color: var(--color-red);
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 700;
        }

        /* ===== STATES ===== */
        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--color-text-light);
            background: var(--color-white);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            stroke: var(--color-light-gray);
            fill: none;
            stroke-width: 1.5;
            margin-bottom: 1rem;
        }

        .loading {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--color-text-light);
            font-weight: 300;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--color-white);
            border-top: 1px solid var(--color-light-gray);
            padding: 1.5rem 0;
            text-align: center;
            margin-top: 3rem;
        }

        .footer-text {
            font-size: 0.8125rem;
            color: var(--color-text-light);
            font-weight: 300;
        }

        /* ===== MOTION ===== */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .panel { padding: 1.75rem 1.25rem; }
            .panel::before { width: 5px; }

            .order-top { padding: 1.25rem; }
            .steps { padding: 0 1.25rem 1rem; }
            .order-info { padding: 0 1.25rem 1.25rem; }
            .order-photos { padding: 0 1.25rem 1.25rem; }

            .info-row {
                grid-template-columns: 1fr;
                gap: 0.15rem;
            }

            .info-label { font-size: 0.75rem; }

            .photos-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }

            .lightbox-nav {
                width: 44px;
                height: 44px;
                font-size: 1.5rem;
            }

            .lightbox-nav-prev { left: 0.5rem; }
            .lightbox-nav-next { right: 0.5rem; }
        }

        @media (max-width: 560px) {
            .logo { font-size: 1.0625rem; }
            .logo-icon { width: 36px; height: 36px; }
            .header-content { flex-wrap: wrap; row-gap: 0.5rem; }
            .back-link { font-size: 0.75rem; }
        }
    </style>
</head>

    <script>
        const firebaseConfig = {

            authDomain: "repair-tracker-e8486.firebaseapp.com",

        firebase.initializeApp(firebaseConfig);

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        const STATUS_LABELS = {
            received: 'Принят',
            diagnosing: 'Диагностика',
            repairing: 'Ремонт',
            testing: 'Тестирование',
            ready: 'Готов к выдаче',
            completed: 'Выдан'
        };

        const STATUS_ORDER = ['received', 'diagnosing', 'repairing', 'testing', 'ready', 'completed'];

        const SESSION_KEY = 'rt_client_phone';
        const SESSION_TTL = 12 * 60 * 60 * 1000; // 12 часов

        function App() {
            const [phone, setPhone] = useState('');
            const [activePhone, setActivePhone] = useState('');
            const [orders, setOrders] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [checked, setChecked] = useState(false);
            const [lightbox, setLightbox] = useState(null);
            const [lightboxPhotos, setLightboxPhotos] = useState([]);
            const [lightboxIndex, setLightboxIndex] = useState(0);

            // Закрытие лайтбокса по Escape
            const closeLightbox = useCallback(() => {
                setLightbox(null);
                setLightboxPhotos([]);
                setLightboxIndex(0);
            }, []);

            useEffect(() => {
                if (!lightbox) return;
                const onKey = (e) => {
                    if (e.key === 'Escape') {
                        closeLightbox();
                    } else if (e.key === 'ArrowLeft' && lightboxIndex > 0) {
                        setLightboxIndex(lightboxIndex - 1);
                    } else if (e.key === 'ArrowRight' && lightboxIndex < lightboxPhotos.length - 1) {
                        setLightboxIndex(lightboxIndex + 1);
                    }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [lightbox, closeLightbox, lightboxIndex, lightboxPhotos.length]);

            const openLightbox = useCallback((photos, index) => {
                setLightboxPhotos(photos);
                setLightboxIndex(index);
                setLightbox(photos[index]);
            }, []);

            useEffect(() => {
                if (lightboxPhotos.length > 0 && lightboxIndex >= 0 && lightboxIndex < lightboxPhotos.length) {
                    setLightbox(lightboxPhotos[lightboxIndex]);
                }
            }, [lightboxIndex, lightboxPhotos]);

            const goToPrevPhoto = () => {
                if (lightboxIndex > 0) setLightboxIndex(lightboxIndex - 1);
            };

            const goToNextPhoto = () => {
                if (lightboxIndex < lightboxPhotos.length - 1) setLightboxIndex(lightboxIndex + 1);
            };

            // Восстановление сессии при загрузке
            useEffect(() => {
                try {
                    const raw = sessionStorage.getItem(SESSION_KEY);
                    if (!raw) { setChecked(true); return; }
                    const s = JSON.parse(raw);
                    if (s && s.phone && typeof s.ts === 'number' && (Date.now() - s.ts) < SESSION_TTL) {
                        setActivePhone(s.phone);
                        loadOrders(s.phone);
                    } else {
                        sessionStorage.removeItem(SESSION_KEY);
                    }
                } catch (e) {
                    sessionStorage.removeItem(SESSION_KEY);
                }
                setChecked(true);
            }, []);

            async function loadOrders(phoneValue) {
                setLoading(true);
                setError('');
                try {
                    const snapshot = await db.collection('orders')
                        .where('phone', '==', phoneValue)
                        .get();

                    const found = [];
                    snapshot.forEach(doc => {
                        found.push({ id: doc.id, ...doc.data() });
                    });

                    // Свежие сверху
                    found.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

                    setOrders(found);
                } catch (err) {
                    console.error('Error loading orders:', err);
                    setError('Не удалось загрузить заказы. Проверьте соединение и попробуйте снова.');
                    setOrders([]);
                }
                setLoading(false);
            }

            const handleLogin = async (e) => {
                e.preventDefault();
                const value = phone.trim();
                if (!value) return;

                sessionStorage.setItem(SESSION_KEY, JSON.stringify({ phone: value, ts: Date.now() }));
                setActivePhone(value);
                await loadOrders(value);
            };

            const handleLogout = () => {
                try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
                setActivePhone('');
                setOrders([]);
                setPhone('');
                setError('');
            };

            if (!checked) {
                return <div className="loading"><p>Загрузка…</p></div>;
            }

            if (!activePhone) {
                return (
                    <div className="panel">
                        <h1 className="panel-title">Личный кабинет</h1>
                        <p className="panel-subtitle">Введите номер телефона, который указывали при сдаче инструмента в ремонт</p>

                        {error && <div className="error">{error}</div>}

                        <form onSubmit={handleLogin}>
                            <div className="form-group">
                                <label className="label" htmlFor="phone">Номер телефона</label>
                                <input
                                    id="phone"
                                    type="tel"
                                    className="input"
                                    placeholder="+7 (___) ___-__-__"
                                    value={phone}
                                    onChange={(e) => setPhone(e.target.value)}
                                    required
                                    autoFocus
                                />
                            </div>

                            <button type="submit" className="btn" disabled={loading}>
                                {loading ? 'Поиск…' : 'Войти'}
                            </button>
                        </form>

                        <p className="hint">
                            Если заказы не находятся, проверьте, что номер введён так же, как при оформлении —
                            или позвоните нам по телефону +7 (930) 114-07-62.
                        </p>
                    </div>
                );
            }

            return (
                <>
                    <div className="cab-head">
                        <div>
                            <h1 className="cab-title">Мои заказы</h1>
                            <p className="cab-phone">Телефон: <strong>{activePhone}</strong></p>
                        </div>
                        <button className="btn btn-ghost" onClick={handleLogout}>Выйти</button>
                    </div>

                    {loading && (
                        <div className="loading"><p>Загрузка заказов…</p></div>
                    )}

                    {error && !loading && (
                        <div className="empty-state">
                            <p>{error}</p>
                        </div>
                    )}

                    {!loading && !error && orders.length === 0 && (
                        <div className="empty-state">
                            <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>
                            <p>По этому номеру заказов не найдено</p>
                        </div>
                    )}

                    {!loading && orders.map(order => (
                        <OrderCard key={order.id} order={order} onPhotoClick={openLightbox} />
                    ))}

                    {lightbox && (
                        <div className="lightbox" onClick={closeLightbox} role="dialog" aria-modal="true">
                            <button className="lightbox-close" aria-label="Закрыть">×</button>

                            <div className="lightbox-content" onClick={(e) => e.stopPropagation()}>
                                <img src={lightbox} alt={`Фото ремонта ${lightboxIndex + 1}`} />

                                {lightboxPhotos.length > 1 && (
                                    <>
                                        <button
                                            className="lightbox-nav lightbox-nav-prev"
                                            onClick={goToPrevPhoto}
                                            disabled={lightboxIndex === 0}
                                            aria-label="Предыдущее фото"
                                        >
                                            ‹
                                        </button>
                                        <button
                                            className="lightbox-nav lightbox-nav-next"
                                            onClick={goToNextPhoto}
                                            disabled={lightboxIndex === lightboxPhotos.length - 1}
                                            aria-label="Следующее фото"
                                        >
                                            ›
                                        </button>
                                        <div className="lightbox-counter">
                                            {lightboxIndex + 1} / {lightboxPhotos.length}
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </>
            );
        }

        function OrderCard({ order, onPhotoClick }) {
            const idx = STATUS_ORDER.indexOf(order.status);
            const photos = order.photos || [];

            return (
                <article className="order">
                    <div className="order-top">
                        <div>
                            <div className="order-num">Заказ #{String(order.id).substring(0, 10)}</div>
                            <div className="order-device">{order.device || 'Инструмент'}</div>
                        </div>
                        <span className={`status-badge status-${order.status}`}>
                            {STATUS_LABELS[order.status] || order.status}
                        </span>
                    </div>

                    {idx >= 0 && (
                        <div className="steps" aria-hidden="true">
                            {STATUS_ORDER.map((s, i) => {
                                let cls = 'step';
                                if (i < idx) cls += ' done';
                                else if (i === idx) cls += ' current';
                                return <span key={s} className={cls}></span>;
                            })}
                        </div>
                    )}

                    <div className="order-info">
                        {order.issue && (
                            <div className="info-row">
                                <span className="info-label">Неисправность</span>
                                <span className="info-value">{order.issue}</span>
                            </div>
                        )}

                        {order.estimatedCost && (
                            <div className="info-row">
                                <span className="info-label">Стоимость</span>
                                <span className="cost">{order.estimatedCost} ₽</span>
                            </div>
                        )}

                        {order.completionDate && (
                            <div className="info-row">
                                <span className="info-label">Дата выдачи</span>
                                <span className="info-value">{formatShortDate(order.completionDate)}</span>
                            </div>
                        )}

                        {order.notes && (
                            <div className="info-row">
                                <span className="info-label">Примечания мастера</span>
                                <span className="info-value">{order.notes}</span>
                            </div>
                        )}

                        {order.createdAt && (
                            <div className="info-row">
                                <span className="info-label">Дата приёма</span>
                                <span className="info-value">{formatDate(order.createdAt)}</span>
                            </div>
                        )}

                        {order.updatedAt && (
                            <div className="info-row">
                                <span className="info-label">Обновлено</span>
                                <span className="info-value">{formatDate(order.updatedAt)}</span>
                            </div>
                        )}
                    </div>

                    {photos.length > 0 && (
                        <div className="order-photos">
                            <div className="photos-label">Процесс ремонта</div>
                            <div className="photos-grid">
                                {photos.map((photo, idx) => (
                                    <div
                                        key={idx}
                                        className="order-photo-item"
                                        onClick={() => onPhotoClick(photos, idx)}
                                        role="button"
                                        tabIndex="0"
                                        aria-label={`Фото ${idx + 1}`}
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter' || e.key === ' ') {
                                                e.preventDefault();
                                                onPhotoClick(photos, idx);
                                            }
                                        }}
                                    >
                                        <img src={photo} alt={`Процесс ремонта ${idx + 1}`} loading="lazy" />
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </article>
            );
        }

        function formatDate(value) {
            try {
                const d = new Date(value);
                if (isNaN(d.getTime())) return '';
                return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
            } catch (e) {
                return '';
            }
        }

        function formatShortDate(value) {
            try {
                const d = new Date(value);
                if (isNaN(d.getTime())) return '';
                return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
            } catch (e) {
                return '';
            }
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
