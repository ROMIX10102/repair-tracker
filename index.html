<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ремонт Электроинструментов — Отслеживание</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --surface-0: #0A0E14;
            --surface-1: #0F1419;
            --surface-2: #13171D;
            --surface-3: #1A1F28;
            --surface-4: #22272F;
            --surface-5: #2C3139;

            --accent: #38BDF8;
            --accent-dim: #0C4A6E;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --warning: #FB923C;
            --success: #6EE7B7;

            --text-primary: #E8EDF3;
            --text-secondary: #8B95A3;
            --text-dim: #5F6975;

            --font-display: system-ui, -apple-system, sans-serif;
            --font-body: system-ui, -apple-system, sans-serif;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-full: 999px;

            --space-xs: 0.5rem;
            --space-sm: 0.75rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            --space-2xl: 3rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--surface-0);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .app {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: var(--space-lg);
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: var(--space-2xl);
        }

        .logo {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            margin-bottom: var(--space-sm);
            text-shadow: 0 0 40px var(--accent-glow);
        }

        .logo-accent {
            color: var(--accent);
            filter: drop-shadow(0 0 20px var(--accent));
        }

        .tagline {
            color: var(--text-secondary);
            font-size: clamp(0.875rem, 2vw, 1rem);
            letter-spacing: 0.02em;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--space-lg);
            margin-top: var(--space-2xl);
        }

        .mode-card {
            background: var(--surface-2);
            border: 1px solid var(--surface-4);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .mode-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--accent-glow) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mode-card:hover {
            background: var(--surface-3);
            border-color: var(--accent-dim);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        .mode-card:hover::before {
            opacity: 1;
        }

        .mode-icon {
            width: 56px;
            height: 56px;
            background: var(--accent-dim);
            border-radius: 50%;
            display: grid;
            place-items: center;
            margin-bottom: var(--space-md);
            font-size: 1.75rem;
            position: relative;
            z-index: 1;
        }

        .mode-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: var(--space-xs);
            position: relative;
            z-index: 1;
        }

        .mode-desc {
            color: var(--text-secondary);
            font-size: 0.875rem;
            position: relative;
            z-index: 1;
        }

        .card {
            background: var(--surface-2);
            border: 1px solid var(--surface-4);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            max-width: 600px;
            margin: 0 auto;
            backdrop-filter: blur(10px);
        }

        .card-header {
            margin-bottom: var(--space-xl);
        }

        .card-title {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: var(--space-xs);
            letter-spacing: -0.02em;
        }

        .card-subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .form-group {
            margin-bottom: var(--space-lg);
        }

        .label {
            display: block;
            margin-bottom: var(--space-sm);
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .input {
            width: 100%;
            background: var(--surface-1);
            border: 1px solid var(--surface-4);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            color: var(--text-primary);
            font-size: 1rem;
            font-family: var(--font-body);
            transition: all 0.2s ease;
        }

        .input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface-2);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input::placeholder {
            color: var(--text-dim);
        }

        .btn {
            background: var(--accent);
            color: var(--surface-0);
            border: none;
            border-radius: var(--radius-full);
            padding: var(--space-md) var(--space-xl);
            font-size: 1rem;
            font-weight: 600;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: #0EA5E9;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
        }

        .btn-small {
            padding: var(--space-sm) var(--space-lg);
            font-size: 0.875rem;
            width: auto;
        }

        .status-card {
            background: var(--surface-3);
            border: 1px solid var(--surface-4);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            margin-top: var(--space-xl);
        }

        .status-badge {
            display: inline-block;
            padding: var(--space-xs) var(--space-md);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: var(--space-md);
        }

        .status-received { background: var(--accent-dim); color: var(--accent); }
        .status-diagnosing { background: #7C2D12; color: var(--warning); }
        .status-repairing { background: #7C2D12; color: var(--warning); }
        .status-testing { background: #065F46; color: var(--success); }
        .status-ready { background: #065F46; color: var(--success); }
        .status-completed { background: var(--surface-5); color: var(--text-secondary); }

        .status-info {
            display: grid;
            gap: var(--space-md);
        }

        .info-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: var(--space-md);
        }

        .info-label {
            color: var(--text-dim);
            font-size: 0.875rem;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 500;
        }

        .back-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--surface-4);
            margin-bottom: var(--space-xl);
        }

        .back-btn:hover {
            background: var(--surface-3);
            color: var(--text-primary);
            border-color: var(--surface-5);
            transform: translateY(0);
        }

        .empty-state {
            text-align: center;
            padding: var(--space-2xl);
            color: var(--text-secondary);
        }

        .loading {
            text-align: center;
            padding: var(--space-2xl);
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .info-row {
                grid-template-columns: 1fr;
                gap: var(--space-xs);
            }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div id="root"></div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCpUn1ch7sI1vNWnrX4HMG024J3vfmJHXQ",
            authDomain: "repair-tracker-e8486.firebaseapp.com",
            databaseURL: "https://repair-tracker-e8486-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "repair-tracker-e8486",
            storageBucket: "repair-tracker-e8486.firebasestorage.app",
            messagingSenderId: "967280277566",
            appId: "1:967280277566:web:bccbba44dc9ecf4ad6396f"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Particle Animation System
        class ParticleSystem {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.mouse = { x: null, y: null };
                this.particleCount = 80;
                this.maxDistance = 150;
                this.mouseRadius = 200;

                this.resize();
                this.init();
                this.animate();

                window.addEventListener('resize', () => this.resize());
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                });

                window.addEventListener('mouseout', () => {
                    this.mouse.x = null;
                    this.mouse.y = null;
                });
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                this.particles = [];
                for (let i = 0; i < this.particleCount; i++) {
                    this.particles.push({
                        x: Math.random() * this.canvas.width,
                        y: Math.random() * this.canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: (Math.random() - 0.5) * 0.5,
                        radius: Math.random() * 2 + 1
                    });
                }
            }

            drawParticle(particle) {
                this.ctx.beginPath();
                this.ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                this.ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
                this.ctx.fill();
            }

            drawLine(p1, p2, distance) {
                const opacity = 1 - (distance / this.maxDistance);
                this.ctx.beginPath();
                this.ctx.moveTo(p1.x, p1.y);
                this.ctx.lineTo(p2.x, p2.y);
                this.ctx.strokeStyle = `rgba(56, 189, 248, ${opacity * 0.2})`;
                this.ctx.lineWidth = 0.5;
                this.ctx.stroke();
            }

            update() {
                for (let particle of this.particles) {
                    if (this.mouse.x !== null && this.mouse.y !== null) {
                        const dx = this.mouse.x - particle.x;
                        const dy = this.mouse.y - particle.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < this.mouseRadius) {
                            const force = (1 - distance / this.mouseRadius) * 0.02;
                            particle.vx += dx * force;
                            particle.vy += dy * force;
                        }
                    }

                    particle.x += particle.vx;
                    particle.y += particle.vy;

                    particle.vx *= 0.98;
                    particle.vy *= 0.98;

                    particle.vx += (Math.random() - 0.5) * 0.1;
                    particle.vy += (Math.random() - 0.5) * 0.1;

                    const maxVel = 2;
                    const vel = Math.sqrt(particle.vx ** 2 + particle.vy ** 2);
                    if (vel > maxVel) {
                        particle.vx = (particle.vx / vel) * maxVel;
                        particle.vy = (particle.vy / vel) * maxVel;
                    }

                    if (particle.x < 0 || particle.x > this.canvas.width) {
                        particle.vx *= -1;
                        particle.x = Math.max(0, Math.min(this.canvas.width, particle.x));
                    }
                    if (particle.y < 0 || particle.y > this.canvas.height) {
                        particle.vy *= -1;
                        particle.y = Math.max(0, Math.min(this.canvas.height, particle.y));
                    }
                }
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                for (let i = 0; i < this.particles.length; i++) {
                    for (let j = i + 1; j < this.particles.length; j++) {
                        const dx = this.particles[i].x - this.particles[j].x;
                        const dy = this.particles[i].y - this.particles[j].y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < this.maxDistance) {
                            this.drawLine(this.particles[i], this.particles[j], distance);
                        }
                    }
                }

                for (let particle of this.particles) {
                    this.drawParticle(particle);
                }
            }

            animate() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        const canvas = document.getElementById('particles-canvas');
        new ParticleSystem(canvas);
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const STATUS_LABELS = {
            received: 'Принят',
            diagnosing: 'Диагностика',
            repairing: 'Ремонт',
            testing: 'Тестирование',
            ready: 'Готов к выдаче',
            completed: 'Выдан'
        };

        function App() {
            const [mode, setMode] = useState(null);

            return (
                <div className="app">
                    <div className="container">
                        {!mode && (
                            <>
                                <header className="header">
                                    <h1 className="logo">
                                        <span className="logo-accent">⚡</span> Ремонт Инструментов
                                    </h1>
                                    <p className="tagline">Профессиональный ремонт электроинструментов</p>
                                </header>

                                <div className="mode-selector">
                                    <div className="mode-card" onClick={() => setMode('client')}>
                                        <div className="mode-icon">📦</div>
                                        <h2 className="mode-title">Отследить заказ</h2>
                                        <p className="mode-desc">Проверьте статус вашего ремонта по номеру телефона</p>
                                    </div>
                                </div>
                            </>
                        )}

                        {mode === 'client' && <ClientView onBack={() => setMode(null)} />}
                    </div>
                </div>
            );
        }

        function ClientView({ onBack }) {
            const [phone, setPhone] = useState('');
            const [orders, setOrders] = useState([]);
            const [searched, setSearched] = useState(false);
            const [loading, setLoading] = useState(false);

            const handleSearch = async (e) => {
                e.preventDefault();
                setLoading(true);

                try {
                    const snapshot = await db.collection('orders')
                        .where('phone', '==', phone)
                        .get();

                    const foundOrders = [];
                    snapshot.forEach(doc => {
                        foundOrders.push({ id: doc.id, ...doc.data() });
                    });

                    setOrders(foundOrders);
                    setSearched(true);
                } catch (error) {
                    console.error('Error fetching orders:', error);
                    setOrders([]);
                    setSearched(true);
                }

                setLoading(false);
            };

            return (
                <>
                    <button className="btn back-btn btn-small" onClick={onBack}>
                        ← Назад
                    </button>

                    <div className="card">
                        <div className="card-header">
                            <h2 className="card-title">Отследить заказ</h2>
                            <p className="card-subtitle">Введите номер телефона, указанный при оформлении</p>
                        </div>

                        <form onSubmit={handleSearch}>
                            <div className="form-group">
                                <label className="label">Номер телефона</label>
                                <input
                                    type="tel"
                                    className="input"
                                    placeholder="+7 (___) ___-__-__"
                                    value={phone}
                                    onChange={(e) => setPhone(e.target.value)}
                                    required
                                />
                            </div>

                            <button type="submit" className="btn" disabled={loading}>
                                {loading ? 'Поиск...' : 'Найти заказ'}
                            </button>
                        </form>

                        {loading && (
                            <div className="loading">
                                <p>Поиск заказов...</p>
                            </div>
                        )}

                        {searched && !loading && orders.length === 0 && (
                            <div className="empty-state">
                                <p>Заказы с таким номером не найдены</p>
                            </div>
                        )}

                        {orders.map(order => (
                            <div key={order.id} className="status-card">
                                <span className={`status-badge status-${order.status}`}>
                                    {STATUS_LABELS[order.status]}
                                </span>

                                <div className="status-info">
                                    <div className="info-row">
                                        <span className="info-label">Номер заказа</span>
                                        <span className="info-value">#{order.id}</span>
                                    </div>
                                    <div className="info-row">
                                        <span className="info-label">Инструмент</span>
                                        <span className="info-value">{order.device}</span>
                                    </div>
                                    <div className="info-row">
                                        <span className="info-label">Проблема</span>
                                        <span className="info-value">{order.issue}</span>
                                    </div>
                                    {order.estimatedCost && (
                                        <div className="info-row">
                                            <span className="info-label">Примерная стоимость</span>
                                            <span className="info-value">{order.estimatedCost} ₽</span>
                                        </div>
                                    )}
                                    <div className="info-row">
                                        <span className="info-label">Дата приема</span>
                                        <span className="info-value">
                                            {order.createdAt ? new Date(order.createdAt).toLocaleDateString('ru-RU') : '-'}
                                        </span>
                                    </div>
                                    {order.notes && (
                                        <div className="info-row">
                                            <span className="info-label">Примечания</span>
                                            <span className="info-value">{order.notes}</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
