<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Ремонт Инструментов</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-red: #D32F2F;
            --color-blue: #0097A7;
            --color-yellow: #F9A825;
            --color-dark: #37474F;
            --color-background: #ECEFF1;
            --color-white: #FFFFFF;
            --color-light-gray: #CFD8DC;
            --color-text: #263238;
            --color-text-light: #546E7A;

            --font-heading: 'Oswald', sans-serif;
            --font-body: 'Roboto', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--color-background);
            color: var(--color-text);
            font-family: var(--font-body);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg,
                var(--color-red) 0%,
                var(--color-red) 25%,
                var(--color-blue) 25%,
                var(--color-blue) 50%,
                var(--color-yellow) 50%,
                var(--color-yellow) 75%,
                var(--color-dark) 75%,
                var(--color-dark) 100%
            );
            transform: skewY(-3deg);
            transform-origin: bottom left;
            opacity: 0.1;
            z-index: 0;
        }

        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 3rem;
            background: var(--color-white);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            position: relative;
            z-index: 10;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg,
                var(--color-red) 0%,
                var(--color-red) 33%,
                var(--color-blue) 33%,
                var(--color-blue) 66%,
                var(--color-yellow) 66%,
                var(--color-yellow) 100%
            );
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--color-dark);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .subtitle {
            color: var(--color-text-light);
            font-size: 0.875rem;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .form-group { margin-bottom: 1.5rem; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-dark);
            font-weight: 500;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input {
            width: 100%;
            padding: 1rem;
            background: var(--color-white);
            border: 2px solid var(--color-light-gray);
            border-radius: 0;
            color: var(--color-text);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input:hover { border-color: var(--color-text-light); }

        input:focus {
            outline: none;
            border-color: var(--color-red);
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--color-red);
            color: white;
            border: none;
            border-radius: 0;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: all 0.2s ease;
            min-height: 56px;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            background: #B71C1C;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.3);
        }

        button:focus {
            outline: 3px solid var(--color-dark);
            outline-offset: 2px;
        }

        .error {
            background: rgba(211, 47, 47, 0.1);
            border: 2px solid var(--color-red);
            color: var(--color-red);
            padding: 1rem;
            border-radius: 0;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
        }

        .error.show { display: block; }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--color-text-light);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
        }

        .back-link a:hover {
            color: var(--color-red);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Вход</h1>
        <p class="subtitle">Панель Администратора</p>

        <div class="error" id="error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>

            <button type="submit">Войти</button>
        </form>

        <div class="back-link">
            <a href="index.html">← На Главную</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCpUn1ch7sI1vNWnrX4HMG024J3vfmJHXQ",
            authDomain: "repair-tracker-e8486.firebaseapp.com",
            databaseURL: "https://repair-tracker-e8486-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "repair-tracker-e8486",
            storageBucket: "repair-tracker-e8486.firebasestorage.app",
            messagingSenderId: "967280277566",
            appId: "1:967280277566:web:bccbba44dc9ecf4ad6396f"
        };

        firebase.initializeApp(firebaseConfig);

        const ADMIN_CREDENTIALS = {
            username: 'admin',
            password: 'repair2024'
        };

        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('error');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
                const authData = {
                    isAdmin: true,
                    loginTime: Date.now()
                };
                localStorage.setItem('adminAuth', JSON.stringify(authData));
                window.location.href = 'admin.html';
            } else {
                errorDiv.textContent = 'Неверный логин или пароль';
                errorDiv.classList.add('show');

                setTimeout(() => {
                    errorDiv.classList.remove('show');
                }, 3000);
            }
        });

        const authData = localStorage.getItem('adminAuth');
        if (authData) {
            try {
                const parsed = JSON.parse(authData);
                if (parsed.isAdmin && (Date.now() - parsed.loginTime < 1800000)) {
                    window.location.href = 'admin.html';
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
