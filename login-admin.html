<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Вход — Ремонт Инструмента</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-red: #D32F2F;
            --color-blue: #0097A7;
            --color-yellow: #F9A825;
            --color-dark: #37474F;
            --color-background: #ECEFF1;
            --color-white: #FFFFFF;
            --color-light-gray: #CFD8DC;
            --color-text: #263238;
            --color-text-light: #546E7A;
            --font-heading: 'Oswald', sans-serif;
            --font-body: 'Roboto', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--color-background);
            color: var(--color-text);
            font-family: var(--font-body);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg,
                var(--color-red) 0%, var(--color-red) 25%,
                var(--color-blue) 25%, var(--color-blue) 50%,
                var(--color-yellow) 50%, var(--color-yellow) 75%,
                var(--color-dark) 75%, var(--color-dark) 100%);
            transform: skewY(-3deg);
            transform-origin: bottom left;
            opacity: 0.08;
            z-index: 0;
        }

        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 2.5rem;
            background: var(--color-white);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            position: relative;
            z-index: 10;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg,
                var(--color-red) 0%, var(--color-red) 33%,
                var(--color-blue) 33%, var(--color-blue) 66%,
                var(--color-yellow) 66%, var(--color-yellow) 100%);
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 1.875rem;
            margin-bottom: 0.35rem;
            color: var(--color-dark);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .subtitle {
            color: var(--color-text-light);
            font-size: 0.875rem;
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .form-group { margin-bottom: 1.25rem; }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-dark);
            font-weight: 500;
            font-size: 0.8125rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: var(--color-white);
            border: 2px solid var(--color-light-gray);
            color: var(--color-text);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:hover { border-color: var(--color-text-light); }

        input:focus {
            outline: none;
            border-color: var(--color-red);
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.12);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--color-red);
            color: white;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 1rem;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            min-height: 56px;
        }

        button:hover:not(:disabled) {
            background: #B71C1C;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(211, 47, 47, 0.3);
        }

        button:focus-visible {
            outline: 3px solid var(--color-dark);
            outline-offset: 2px;
        }

        button:disabled {
            background: var(--color-light-gray);
            color: var(--color-text-light);
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: rgba(211, 47, 47, 0.08);
            border-left: 4px solid var(--color-red);
            color: var(--color-red);
            padding: 0.9rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            font-weight: 500;
            display: none;
        }

        .error.show { display: block; }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--color-text-light);
            text-decoration: none;
            font-size: 0.8125rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
        }

        .back-link a:hover { color: var(--color-red); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Вход</h1>
        <p class="subtitle">Панель администратора</p>

        <div class="error" id="error"></div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" required autofocus autocomplete="off" spellcheck="false">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" required autocomplete="new-password">
            </div>

            <button type="submit" id="submitBtn">Войти</button>
        </form>

        <div class="back-link">
            <a href="index.html">← На главную</a>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCpUn1ch7sI1vNWnrX4HMG024J3vfmJHXQ",
            authDomain: "repair-tracker-e8486.firebaseapp.com",
            databaseURL: "https://repair-tracker-e8486-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "repair-tracker-e8486",
            storageBucket: "repair-tracker-e8486.firebasestorage.app",
            messagingSenderId: "967280277566",
            appId: "1:967280277566:web:bccbba44dc9ecf4ad6396f"
        };

        firebase.initializeApp(firebaseConfig);

        // ---------------------------------------------------------------
        // Хранятся ТОЛЬКО хеши SHA-256, сам пароль в коде отсутствует.
        // Чтобы сменить пароль: открой консоль браузера и выполни
        //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('НОВЫЙ_ПАРОЛЬ'))
        //   .then(b => console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
        // и подставь полученную строку ниже.
        // ---------------------------------------------------------------
        const ADMIN_LOGIN_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";
        const ADMIN_PASS_HASH = "69f4dbc1634cfc93022f89dd458ee38463e87d4d36c449c0602d09dbf6ea25f4";

        const SESSION_KEY = 'rt_admin_session';
        const SESSION_TTL = 30 * 60 * 1000; // 30 минут неактивности

        async function sha256(text) {
            if (!window.crypto || !window.crypto.subtle) {
                throw new Error('unsupported');
            }
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
            return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');
        let failedAttempts = 0;

        function showError(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.add('show');
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            errorDiv.classList.remove('show');

            // Простая защита от перебора
            if (failedAttempts >= 5) {
                showError('Слишком много попыток. Подождите минуту.');
                setTimeout(() => { failedAttempts = 0; }, 60000);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Проверка...';

            const login = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            try {
                const [loginHash, passHash] = await Promise.all([sha256(login), sha256(pass)]);

                if (loginHash === ADMIN_LOGIN_HASH && passHash === ADMIN_PASS_HASH) {
                    // sessionStorage: сессия живёт до закрытия вкладки/браузера
                    sessionStorage.setItem(SESSION_KEY, JSON.stringify({
                        ok: true,
                        ts: Date.now()
                    }));
                    window.location.replace('admin.html');
                } else {
                    failedAttempts++;
                    showError('Неверный логин или пароль');
                    document.getElementById('password').value = '';
                }
            } catch (err) {
                if (err && err.message === 'unsupported') {
                    showError('Браузер не поддерживает защищённый вход. Откройте сайт по адресу https://…');
                } else {
                    showError('Ошибка проверки. Обновите страницу.');
                }
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'Войти';
        });
    </script>
</body>
</html>
