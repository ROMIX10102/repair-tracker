<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админ-панель</title>
    <style>
        :root {
            --surface-0: #0A0E14;
            --surface-1: #0F1419;
            --surface-2: #13171D;
            --surface-3: #1A1F28;
            --surface-4: #22272F;
            --accent: #38BDF8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --text-primary: #E8EDF3;
            --text-secondary: #8B95A3;
            --warning: #FB923C;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--surface-0);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1rem;
        }

        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            background: var(--surface-2);
            border-radius: 16px;
            border: 1px solid var(--surface-4);
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: var(--surface-1);
            border: 1px solid var(--surface-4);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface-2);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--accent);
            color: var(--surface-0);
            border: none;
            border-radius: 999px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #0EA5E9;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.3);
        }

        .error {
            background: rgba(124, 45, 18, 0.2);
            border: 1px solid #7C2D12;
            color: var(--warning);
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
        }

        .error.show {
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 1rem;
        }

        .back-link a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
        }

        .back-link a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Вход в админ-панель</h1>
        <p class="subtitle">Введите учетные данные</p>

        <div class="error" id="error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" id="username" required autofocus>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit">Войти</button>
        </form>

        <div class="back-link">
            <a href="repair-tracker.html">← Вернуться на главную</a>
        </div>
    </div>

    <script>
        // Учетные данные (в реальном проекте должны быть на сервере)
        const ADMIN_CREDENTIALS = {
            username: 'admin',
            password: 'repair2024'
        };

        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('error');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
                // Устанавливаем флаг авторизации с временной меткой
                const authData = {
                    isAdmin: true,
                    loginTime: Date.now()
                };
                localStorage.setItem('adminAuth', JSON.stringify(authData));

                // Перенаправляем в админку
                window.location.href = 'admin-panel.html';
            } else {
                errorDiv.textContent = 'Неверный логин или пароль';
                errorDiv.classList.add('show');

                setTimeout(() => {
                    errorDiv.classList.remove('show');
                }, 3000);
            }
        });

        // Проверяем, не авторизован ли уже пользователь
        const authData = localStorage.getItem('adminAuth');
        if (authData) {
            try {
                const parsed = JSON.parse(authData);
                // Проверяем таймаут (30 минут = 1800000 мс)
                if (parsed.isAdmin && (Date.now() - parsed.loginTime < 1800000)) {
                    window.location.href = 'admin-panel.html';
                }
            } catch (e) {
                // Игнорируем ошибки парсинга
            }
        }
    </script>
</body>
</html>
